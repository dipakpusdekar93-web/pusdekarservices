<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pusdekar Digital</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0061f2, #60efff);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 10px;
            color: #333;
            font-size: 24px;
        }
        .login-card p {
            color: #666;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #444;
            font-size: 13px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #0061f2;
            outline: none;
        }
        .login-btn {
            background: linear-gradient(135deg, #0061f2, #0043c2);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 97, 242, 0.3);
            transition: transform 0.2s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
        }
        #errorMsg {
            color: #ff3366;
            font-size: 13px;
            margin-top: 15px;
            font-weight: bold;
            display: none;
        }
        .brand-footer {
            margin-top: 25px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Pusdekar Digital</h2>
        <p>प्रवेश करण्यासाठी तुमचा ईमेल आणि पासवर्ड टाका</p>
        
        <div class="form-group">
            <label>Registered Email</label>
            <input type="email" id="email" placeholder="email@example.com">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button class="login-btn" onclick="loginUser()">Login to Dashboard</button>
        
        <div id="errorMsg"></div>

        <div class="brand-footer">
            Secure Management System
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCKGCAEv8_YiBt1oZzZVz4zMbNL5yiVA1U",
            authDomain: "pusdekar-services.firebaseapp.com",
            projectId: "pusdekar-services",
            storageBucket: "pusdekar-services.firebasestorage.app",
            messagingSenderId: "438865671103",
            appId: "1:438865671103:web:4b0757f0d41c9dde35e70a",
            measurementId: "G-7F82VD9WM9"
        };

        firebase.initializeApp(firebaseConfig);

        // जर आधीच लॉगिन असेल तर थेट डॅशबोर्डवर पाठवा
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                window.location.href = "dashboard.html";
            }
        });

        function loginUser() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (!email || !password) {
                errorMsg.innerText = "कृपया ईमेल आणि पासवर्ड दोन्ही भरा!";
                errorMsg.style.display = "block";
                return;
            }

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // यशस्वी लॉगिन झाल्यावर डॅशबोर्डवर जाईल
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    errorMsg.innerText = "चुकीचा ईमेल किंवा पासवर्ड! पुन्हा प्रयत्न करा.";
                    errorMsg.style.display = "block";
                });
        }
    </script>
</body>
</html>
