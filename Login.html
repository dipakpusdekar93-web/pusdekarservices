<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Pusdekar Services</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f4; margin: 0; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); width: 100%; max-width: 320px; text-align: center; }
        .login-box h2 { margin-bottom: 20px; color: #333; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { width: 100%; padding: 10px; background: #007BFF; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
        #error-message { color: red; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Shop Login</h2>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button onclick="loginUser()">Login</button>
        <p id="error-message"></p>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        // तुमचा Firebase Config कोड 
        const firebaseConfig = {
            apiKey: "AIzaSyCKGCAEv8_YiBt1oZzZVz4zMbNL5yiVA1U",
            authDomain: "pusdekar-services.firebaseapp.com",
            projectId: "pusdekar-services",
            storageBucket: "pusdekar-services.firebasestorage.app",
            messagingSenderId: "438865671103",
            appId: "1:438865671103:web:4b0757f0d41c9dde35e70a",
            measurementId: "G-7F82VD9WM9"
        };

        // Firebase Initialize करणे
        firebase.initializeApp(firebaseConfig);

        function loginUser() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('error-message');
            
            errorMessage.innerText = "Checking...";

            firebase.auth().signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    alert("Login Successful!");
                    window.location.href = "dashboard.html"; 
                })
                .catch((error) => {
                    errorMessage.innerText = "Error: चुकीचा ईमेल किंवा पासवर्ड.";
                });
        }
    </script>
</body>
</html>
