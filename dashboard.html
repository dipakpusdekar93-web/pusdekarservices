<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Pusdekar Services</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #007BFF; color: white; padding: 10px 20px; border-radius: 8px; }
        .logout-btn { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .logout-btn:hover { background: #c82333; }
        .container { background: white; padding: 20px; margin-top: 20px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .save-btn { background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        .save-btn:hover { background: #218838; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Pusdekar Services - Daily Management</h2>
        <button class="logout-btn" onclick="logoutUser()">Logout</button>
    </div>

    <div class="container">
        <h3>नवीन नोंद (New Entry)</h3>
        
        <div class="form-group">
            <label>सर्व्हिसचा प्रकार (Service Type)</label>
            <select id="serviceType">
                <option value="Money Transfer">Money Transfer (PhonePe/GPay)</option>
                <option value="Fino Payment Bank">Fino Payment Bank Transaction</option>
                <option value="PAN / Aadhaar Services">PAN / Aadhaar Services</option>
                <option value="Printing & Xerox">Xerox / Printing / Banner</option>
                <option value="Bill Payment">Bill Payment / Recharge</option>
                <option value="Shop Expense">दुकानाचा खर्च (Shop Expense)</option>
            </select>
        </div>

        <div class="form-group">
            <label>रक्कम (Amount in ₹)</label>
            <input type="number" id="amount" placeholder="उदा. 500">
        </div>

        <div class="form-group">
            <label>तपशील / ग्राहकाचे नाव (Details)</label>
            <input type="text" id="details" placeholder="ग्राहकाचे नाव किंवा सेवेची माहिती">
        </div>

        <button class="save-btn" onclick="saveEntry()">Save Entry</button>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        // तुमचा Firebase Config कोड 
        const firebaseConfig = {
            apiKey: "AIzaSyCKGCAEv8_YiBt1oZzZVz4zMbNL5yiVA1U",
            authDomain: "pusdekar-services.firebaseapp.com",
            projectId: "pusdekar-services",
            storageBucket: "pusdekar-services.firebasestorage.app",
            messagingSenderId: "438865671103",
            appId: "1:438865671103:web:4b0757f0d41c9dde35e70a",
            measurementId: "G-7F82VD9WM9"
        };

        firebase.initializeApp(firebaseConfig);

        // लॉगीन चेक करणे (विना लॉगीन कोणीही हे पेज उघडू शकणार नाही)
        firebase.auth().onAuthStateChanged((user) => {
            if (!user) {
                window.location.href = "Login.html"; // लॉगीन नसेल तर परत लॉगीन पेजवर पाठवा
            }
        });

        // लॉगआऊट फंक्शन
        function logoutUser() {
            firebase.auth().signOut().then(() => {
                window.location.href = "Login.html";
            }).catch((error) => {
                alert("Logout Error!");
            });
        }

        // एंट्री सेव्ह करण्यासाठी डमी फंक्शन (हा डेटा डेटाबेसमध्ये कसा पाठवायचा ते आपण पुढे पाहू)
        function saveEntry() {
            const service = document.getElementById('serviceType').value;
            const amount = document.getElementById('amount').value;
            const details = document.getElementById('details').value;

            if(amount === "" || details === "") {
                alert("कृपया रक्कम आणि तपशील भरा!");
                return;
            }

            alert("तुमची नोंद यशस्वीरित्या सेव्ह झाली!\n\nसर्व्हिस: " + service + "\nरक्कम: ₹" + amount + "\nतपशील: " + details);
            
            // फॉर्म रिकामा करणे
            document.getElementById('amount').value = "";
            document.getElementById('details').value = "";
        }
    </script>
</body>
</html>
