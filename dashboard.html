        function switchTab(tabName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active-view'));

        function loadOnlineLeads() {
            db.collection("onlineLeads").orderBy("timestamp", "desc").onSnapshot(snapshot => {
                const tbody = document.getElementById("leadsTableBody");
                tbody.innerHTML = "";
                if(snapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#64748b;">सध्या कोणतीही नवीन ऑनलाईन ऑर्डर नाही.</td></tr>`;
                    return;
                }
                snapshot.forEach(doc => {
                    let d = doc.data();
                    let dateStr = d.timestamp ? d.timestamp.toDate().toLocaleString('en-IN', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : "-";
                    
                    let docsHtml = "";
                    if(d.documents && d.documents.length > 0) {
                        d.documents.forEach((url, idx) => {
                            if(url.startsWith('data:')) {
                                docsHtml += `<a href="${url}" download="Customer_Doc_${idx+1}.jpg" class="edit-btn" style="text-decoration:none; display:inline-block; margin-bottom:2px;">⬇️ Download Doc ${idx+1}</a> `;
                            } else {
                                docsHtml += `<a href="${url}" target="_blank" class="edit-btn" style="text-decoration:none; display:inline-block; margin-bottom:2px;">📁 View Doc ${idx+1}</a> `;
                            }
                        });
                    } else { docsHtml = "कागदपत्र नाही"; }

                    tbody.innerHTML += `<tr><td>${dateStr}</td><td><b>${d.customerName}</b></td><td><a href="https://wa.me/91${d.mobile}" target="_blank" style="color:#059669; font-weight:bold; text-decoration:none;">💬 ${d.mobile}</a></td><td>${d.service}</td><td class="text-green">₹ ${d.advancePaid}</td><td><b>${d.utrNumber}</b></td><td>${docsHtml}</td><td class="no-print"><button class="done-btn" onclick="markLeadDone('${doc.id}')">✔ पूर्ण झाले</button><button class="delete-btn" onclick="deleteLead('${doc.id}')">❌</button></td></tr>`;
                });
            }, error => console.error(error));
        }
        function markLeadDone(id) { if(confirm("ही ऑर्डर पूर्ण झाली म्हणून मार्क करायची का?")) { db.collection("onlineLeads").doc(id).delete().then(() => { alert("ऑर्डर पूर्ण झाली!"); }); } }
        function deleteLead(id) { if(confirm("ही ऑर्डर डिलीट करायची का?")) { db.collection("onlineLeads").doc(id).delete(); } }

        function calcTally(key) {
            const actInput = document.getElementById('tact_' + key).value;
            const resTd = document.getElementById('tres_' + key);
            const sysStr = document.getElementById('tsys_' + key).innerText.replace('₹ ', '').replace(/,/g, '');
            const sysAmt = parseFloat(sysStr) || 0;
            if(actInput === "") { resTd.innerHTML = "👈 रक्कम टाका"; resTd.style.color = "#0f172a"; return; }
            const actAmt = parseFloat(actInput) || 0; const diff = actAmt - sysAmt;
            if(diff === 0) { resTd.innerHTML = "✅ जुळला (OK)"; resTd.style.color = "var(--success)"; }
            else if(diff > 0) { resTd.innerHTML = `⚠️ +₹ ${Math.abs(diff)} जास्त`; resTd.style.color = "var(--primary)"; }
            else { resTd.innerHTML = `❌ -₹ ${Math.abs(diff)} कमी`; resTd.style.color = "var(--danger)"; }
        }
        function clearAllTallies() { ['cBal','f1Bal','f2Bal','pwBal','pnBal','mBal','b1','b2','b3','b4','b5','b6','b7','b8','b9'].forEach(k => { let el = document.getElementById('tact_' + k); if(el) { el.value = ""; calcTally(k); } }); }

            localStorage.setItem("wallet_fino1", document.getElementById('renameFino1').value || "Fino Dipak"); localStorage.setItem("wallet_fino2", document.getElementById('renameFino2').value || "Fino Pallavi"); localStorage.setItem("wallet_payworld", document.getElementById('renamePayworld').value || "Payworld"); localStorage.setItem("wallet_paynearby", document.getElementById('renamePaynearby').value || "Paynearby"); localStorage.setItem("wallet_mahapower", document.getElementById('renameMahapower').value || "Mahapower");
            BANK_KEYS.forEach((key, i) => { localStorage.setItem("wallet_" + key, document.getElementById('renameB'+(i+1)).value || key); });
            localStorage.setItem("wa_promo_msg", document.getElementById('promoMessage').value); loadWalletNames(); alert("सेटिंग्स सेव्ह झाल्या!"); switchTab('dashboard');
        }

        }

        function toggleFormFields() {
            const st = document.getElementById('serviceType').value; 
            const bRow = document.getElementById('bankSelectRow'); const eRow = document.getElementById('expenseSourceRow'); const aRow = document.getElementById('aepsRow');
            bRow.style.display = "none"; eRow.style.display = "none"; aRow.style.display = "none";

            } else if(st === "Shop Expense") { eRow.style.display = "flex"; } else if(st === "AEPS") { aRow.style.display = "flex"; }

        function checkCAuditRule() { const amt = parseFloat(document.getElementById('amount').value) || 0; const label = document.getElementById('idProofLabel'); if(amt >= 10000) { label.innerHTML = "पॅन/आधार (<b>सक्तीचे</b>)"; label.style.color = "var(--danger)"; } else { label.innerHTML = "पॅन/आधार"; label.style.color = "#334155"; } }
        function calcUdhar() { let t = parseFloat(document.getElementById('moTotal').value) || 0; let p = parseFloat(document.getElementById('moPaid').value) || 0; document.getElementById('moPending').value = (t - p) > 0 ? (t - p) : 0; }

        function searchCustomer() { searchCustLogic('mobile', 'details', 'searchMsg', 'idProof'); }
        function searchCustomerMaha() { searchCustLogic('moMobile', 'moName', 'searchMsgMo', 'moVillage', true); }
        function searchCustLogic(mId, nId, msgId, exId, isMo=false) {
            const mobile = document.getElementById(mId).value; const msgSpan = document.getElementById(msgId);
            if (mobile.length === 10) {
                db.collection("customers").doc(mobile).get().then((doc) => {
                    if (doc.exists) { const d = doc.data(); document.getElementById(nId).value = d.name || ""; document.getElementById(exId).value = isMo ? (d.village||"-") : (d.idProof||"-"); msgSpan.innerHTML="✔️ जुना ग्राहक!"; msgSpan.style.color="var(--success)"; msgSpan.style.display="inline-block"; setTimeout(()=>msgSpan.style.display="none", 3000); } 
                    else { msgSpan.innerHTML=`❌ नंबर नाही!`; msgSpan.style.color="var(--danger)"; msgSpan.style.display="block"; document.getElementById(nId).value=""; }
                });
            }
        }
        function addNewCustomerManually() {
            if(isSavingCust) return;
            const btn = document.getElementById('saveCustomerBtn');
            const name = document.getElementById('cName').value; const mobile = document.getElementById('cMobile').value; const village = document.getElementById('cVillage').value || "-"; const idProof = document.getElementById('cIdProof').value || "-";
            if(name === "" || mobile.length !== 10) return alert("नाव आणि 10 अंकी नंबर आवश्यक!");
            
            isSavingCust = true; btn.disabled = true; btn.innerText = "Saving...";
            db.collection("customers").doc(mobile).set({ name, mobile, village, idProof }, { merge: true }).then(() => { 
                isSavingCust = false; btn.disabled = false; btn.innerText = "💾 ग्राहक सेव्ह करा"; alert("ग्राहक सेव्ह झाला!"); 
            }).catch(() => { isSavingCust = false; btn.disabled = false; btn.innerText = "💾 ग्राहक सेव्ह करा"; });
        }
        function editCust(mobile) { let c = allCustomers.find(x => x.mobile === mobile); if(c) { document.getElementById('cName').value = c.name||""; document.getElementById('cMobile').value = c.mobile||""; document.getElementById('cVillage').value = c.village||""; document.getElementById('cIdProof').value = c.idProof||""; switchTab('customers'); window.scrollTo(0,0); } }
        
        function loadCustomersList() { 
            db.collection("customers").onSnapshot((snap) => { 
                allCustomers = []; snap.forEach(doc => allCustomers.push(doc.data())); 
                renderCustTable(allCustomers); 
            }, err => console.log(err)); 
        }
        function renderCustTable(data) { 
            const tb = document.getElementById("customersTableBody"); 
            tb.innerHTML = ""; 
            document.getElementById("totalCustomersCount").innerText = data.length; 
            let srNo = 1; 
            data.forEach(c => { 
                tb.innerHTML += `<tr><td><b>${srNo++}</b></td><td><b>${c.name}</b></td><td>${c.mobile}</td><td>${c.village}</td><td>${c.idProof}</td><td class="no-print"><button class="edit-btn" onclick="editCust('${c.mobile}')">✏️ Edit</button></td></tr>`; 
            }); 
        }
        function filterCustomerTable() { const q = document.getElementById("customerSearchInput").value.toLowerCase(); renderCustTable(allCustomers.filter(c => c.name.toLowerCase().includes(q) || c.mobile.includes(q) || c.village.toLowerCase().includes(q))); }

        function loadBankDeposits() {
            db.collection("bankDeposits").orderBy("timestamp", "desc").onSnapshot(snap => {
                allBankDeps = []; const tb = document.getElementById('bdTableBody'); tb.innerHTML = "";
                snap.forEach(doc => { allBankDeps.push({id: doc.id, ...doc.data()}); });
                allBankDeps.forEach(d => {
                    let dt = d.timestamp ? d.timestamp.toDate().toLocaleString('en-IN', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : "-";
                    let bName = localStorage.getItem("wallet_" + d.bank) || d.bank;
                    tb.innerHTML += `<tr><td>${dt}</td><td><b>${bName}</b></td><td class="text-green">₹ ${d.amount}</td><td>${d.note}</td><td class="no-print"><button class="delete-btn" onclick="db.collection('bankDeposits').doc('${d.id}').delete()">❌</button></td></tr>`;
                });
            }, err => console.log(err));
        }
        function saveBankDeposit() {
            if(isSavingDep) return;
            const btn = document.getElementById('saveBdBtn');
            const bank = document.getElementById('bdBank').value; const amt = document.getElementById('bdAmount').value; const note = document.getElementById('bdNote').value || "-"; const dVal = document.getElementById('bdDate').value;
            if(bank === "" || amt === "") return alert("बँक आणि रक्कम भरणे आवश्यक आहे!");
            
            isSavingDep = true; btn.disabled = true; btn.innerText = "Saving...";
            let data = { bank: bank, amount: Number(amt), note: note };
            if(dVal) data.timestamp = firebase.firestore.Timestamp.fromDate(new Date(dVal)); else data.timestamp = firebase.firestore.FieldValue.serverTimestamp();
            
            db.collection("bankDeposits").add(data).then(() => { 
                isSavingDep = false; btn.disabled = false; btn.innerText = "💾 कॅश डिपॉझिट सेव्ह करा";
                document.getElementById('bdBank').value=""; document.getElementById('bdAmount').value=""; document.getElementById('bdNote').value=""; alert("सेव्ह झाले!"); 
            }).catch(() => { isSavingDep = false; btn.disabled = false; btn.innerText = "💾 कॅश डिपॉझिट सेव्ह करा"; });
        }
        function deleteBankDep(id) { if(confirm("ही नोंद डिलीट करायची का?")) db.collection("bankDeposits").doc(id).delete(); }

        function saveQuickLink() {
            if(isSavingLink) return;
            const btn = document.getElementById('saveQuickLinkBtn'); 
            const name = document.getElementById('qlName').value; const url = document.getElementById('qlUrl').value; const icon = document.getElementById('qlIcon').value || "🌐";
            if(!name || !url) return alert("नाव आणि URL भरा!"); 
            
            isSavingLink = true; btn.disabled = true; btn.innerText = "Saving...";
            if(editLinkId) { 
                db.collection("quicklinks").doc(editLinkId).update({ name, url, icon }).then(() => { 
                    isSavingLink = false; document.getElementById('qlName').value=""; document.getElementById('qlUrl').value=""; document.getElementById('qlIcon').value=""; editLinkId = null; btn.disabled = false; btn.innerText = "💾 लिंक सेव्ह करा"; alert("लिंक अपडेट झाली!"); 
                }).catch(e => { isSavingLink = false; btn.disabled = false; btn.innerText = "💾 लिंक सेव्ह करा"; }); 
            } else { 
                db.collection("quicklinks").add({ name, url, icon, timestamp: firebase.firestore.FieldValue.serverTimestamp() }).then(() => { 
                    isSavingLink = false; document.getElementById('qlName').value=""; document.getElementById('qlUrl').value=""; document.getElementById('qlIcon').value=""; btn.disabled = false; btn.innerText = "💾 लिंक सेव्ह करा"; alert("लिंक सेव्ह झाली!"); 
                }).catch(e => { isSavingLink = false; btn.disabled = false; btn.innerText = "💾 लिंक सेव्ह करा"; }); 
            }

        function saveAdjustment() {
            if(isSavingAdj) return;
            const btn = document.getElementById('saveAdjBtn'); 
            const adjWallet = document.getElementById('adjWallet').value; const amount = document.getElementById('adjAmount').value; const narration = document.getElementById('adjNarration').value; const customDateVal = document.getElementById('adjCustomDate').value;
            
            if(adjWallet === "") return alert("कोणते खाते ॲडजस्ट करायचे ते निवडा!");
            if(amount === "") return alert("रक्कम भरा!");
            
            isSavingAdj = true; btn.disabled = true; btn.innerText = "Updating...";
            let updateData = { category: "Adjustment", service: adjWallet, amount: Number(amount), bankSource: "-", expenseSource: "-", details: narration ? `Opening/Adjustment (${narration})` : "Opening/Adjustment", mobile: "-", village: "-", payStatus: "Paid", purpose: "Adjustment", idProof: "-", commission: 0 };
            if(customDateVal) updateData.timestamp = firebase.firestore.Timestamp.fromDate(new Date(customDateVal)); else updateData.timestamp = firebase.firestore.FieldValue.serverTimestamp();
            
            db.collection("transactions").add(updateData).then(() => { 
                isSavingAdj = false; btn.disabled = false; btn.innerText = "Update Balance";
                document.getElementById('adjWallet').value=""; document.getElementById('adjAmount').value=""; document.getElementById('adjNarration').value=""; alert("अपडेट झाले!"); 
            }).catch(() => { isSavingAdj = false; btn.disabled = false; btn.innerText = "Update Balance"; });
        }

        function saveEntry() {
            if(isSavingGeneral) return;
            const btn = document.getElementById('saveEntryBtn'); 
            let baseService = document.getElementById('serviceType').value; const amount = parseFloat(document.getElementById('amount').value) || 0; 
            const upiBankVal = document.getElementById('upiBank').value;
            const expenseSource = document.getElementById('expenseSource').value;
            const aepsPortal = document.getElementById('aepsPortal').value;
            const aepsType = document.getElementById('aepsType').value;
            const mobile = document.getElementById('mobile').value; const details = document.getElementById('details').value; const village = document.getElementById('villageInput').value || "-"; const payStatus = document.getElementById('payStatus').value; const purpose = document.getElementById('purpose').value || "-"; const idProof = document.getElementById('idProof').value || "-"; const commission = document.getElementById('commission').value || 0; const narration = document.getElementById('entryNarration').value || "-"; const customDateVal = document.getElementById('entryCustomDate').value;
            
            if(!baseService) return alert("सर्व्हिसचा प्रकार निवडा!");
            if(amount===""||details==="") return alert("माहिती पूर्ण भरा!"); 
            if(payStatus === "") return alert("पेमेंट स्थिती (Paid किंवा Udhar) निवडणे सक्तीचे आहे!");
            if((baseService === "Money Transfer" || baseService === "UPI Cash Given" || baseService === "Self Bank Deposit" || baseService === "Self Bank Withdrawal") && upiBankVal === "") { alert("⚠️ बँक निवडणे सक्तीचे आहे!"); document.getElementById('upiBank').focus(); return; }
            if(baseService === "Shop Expense" && expenseSource === "") { alert("⚠️ खर्च कुठून झाला ते निवडणे सक्तीचे आहे!"); document.getElementById('expenseSource').focus(); return; }
            if(baseService === "AEPS" && (aepsPortal === "" || aepsType === "")) { alert("⚠️ AEPS पोर्टल आणि व्यवहार निवडणे सक्तीचे आहे!"); return; }

            isSavingGeneral = true; btn.disabled = true; btn.innerText = "Saving...";

            let service = baseService;
            if(baseService === "AEPS") {
                if(aepsPortal === "Fino") service = aepsType === "Withdrawal" ? "Fino Payment Bank" : "Fino Cash Deposit";
                else if(aepsPortal === "Fino2") service = aepsType === "Withdrawal" ? "Fino2 Payment Bank" : "Fino2 Cash Deposit";
                else if(aepsPortal === "Payworld") service = aepsType === "Withdrawal" ? "Payworld Services" : "Payworld Cash Deposit";

        function loadDataFromFirebase() {
            db.collection("transactions").orderBy("timestamp", "asc").onSnapshot(snap => {

        function getSafeString(val) { return val ? val.toString() : "-"; }
        
        function processCalculations(dataList) {
            let incT=0, expT=0, incM=0, expM=0; let f1Bal=0, f2Bal=0, pwBal=0, pnBal=0, mBal=0, cBal=0; let bankBal = {}; BANK_KEYS.forEach(k => bankBal[k]=0);
            const now = new Date(); const currentMonth = now.getMonth(); const currentYear = now.getFullYear();

            dataList.forEach(data => {
                let isToday=false, isThisMonth=false;
                if (data.timestamp) { 
                    let docDate = data.timestamp.toDate(); 
                    if(docDate.getDate() === now.getDate() && docDate.getMonth() === now.getMonth() && docDate.getFullYear() === now.getFullYear()) { isToday=true; }
                    if(docDate.getMonth() === currentMonth && docDate.getFullYear() === currentYear) { isThisMonth=true; } 
                }
                const amt = parseFloat(data.amount) || 0; const comm = parseFloat(data.commission) || 0;
                let bSrc = getSafeString(data.bankSource); let eSrc = getSafeString(data.expenseSource); let svc = getSafeString(data.service);
                if (LEGACY_MAP[bSrc]) bSrc = LEGACY_MAP[bSrc]; if (LEGACY_MAP[eSrc]) eSrc = LEGACY_MAP[eSrc];
                if (svc.includes("Opening") && LEGACY_MAP[svc.replace(" Opening", "")]) svc = LEGACY_MAP[svc.replace(" Opening", "")] + " Opening";

                if(data.category === "Mahaonline") {
                    if(bankBal[bSrc] !== undefined) bankBal[bSrc] += amt; else cBal += amt;
                    if(isToday) incT += amt; if(isThisMonth) incM += amt;
                } else {
                    if(svc==="Fino Opening") f1Bal+=amt; else if(svc==="Fino Payment Bank") { f1Bal+=amt; cBal-=amt; } else if(svc==="Fino Cash Deposit") { f1Bal-=amt; cBal+=amt; }
                    else if(svc==="Fino2 Opening") f2Bal+=amt; else if(svc==="Fino2 Payment Bank") { f2Bal+=amt; cBal-=amt; } else if(svc==="Fino2 Cash Deposit") { f2Bal-=amt; cBal+=amt; }
                    else if(svc==="Payworld Opening") pwBal+=amt; else if(svc==="Payworld Services") { pwBal+=amt; cBal-=amt; } else if(svc==="Payworld Cash Deposit") { pwBal-=amt; cBal+=amt; }
                    else if(svc==="Paynearby Opening") pnBal+=amt; else if(svc==="Paynearby Services") { pnBal+=amt; cBal-=amt; } else if(svc==="Paynearby Cash Deposit") { pnBal-=amt; cBal+=amt; }
                    else if(svc==="Mahapower Opening") mBal+=amt; else if(svc==="Mahapower Bill Collection") { mBal-=amt; cBal+=amt; }
                    else if(svc==="Cash Opening") cBal+=amt; else if(svc.includes("Opening") && bankBal[svc.replace(" Opening", "")]!==undefined) bankBal[svc.replace(" Opening", "")] += amt;
                    else if(svc==="Money Transfer") { if(bankBal[bSrc]!==undefined) bankBal[bSrc]-=amt; cBal+=amt; } else if(svc==="UPI Cash Given") { if(bankBal[bSrc]!==undefined) bankBal[bSrc]+=amt; cBal-=amt; }
                    else if(svc==="Self Bank Deposit") { if(bankBal[bSrc]!==undefined) bankBal[bSrc]+=amt; cBal-=amt; } else if(svc==="Self Bank Withdrawal") { if(bankBal[bSrc]!==undefined) bankBal[bSrc]-=amt; cBal+=amt; }
                    else if(svc==="Shop Expense") { if(bankBal[eSrc]!==undefined) bankBal[eSrc]-=amt; else if(eSrc==="Fino") f1Bal-=amt; else if(eSrc==="Fino2") f2Bal-=amt; else if(eSrc==="Payworld") pwBal-=amt; else if(eSrc==="Paynearby") pnBal-=amt; else if(eSrc==="Mahapower") mBal-=amt; else cBal-=amt; }
                    else if(svc==="Udhar Received") { cBal += amt; }

                    if(isToday) { if(svc==="Shop Expense") expT+=amt; }
                    if(isThisMonth) { if(svc==="Shop Expense") expM+=amt; }
                }

                if(comm > 0 && !svc.includes("Opening") && svc !== "Shop Expense" && svc !== "Udhar Received") {
                    cBal += comm; 
                    if(isToday) incT += comm; 
                    if(isThisMonth) incM += comm;
                }
            });

            let tUpi=0; BANK_KEYS.forEach((key,i) => { 
                tUpi+=bankBal[key]; 
                let bEl = document.getElementById('bal-b'+(i+1)); if(bEl) bEl.innerText="₹ "+bankBal[key]; 
                let tsEl = document.getElementById('tsys_b'+(i+1)); if(tsEl) tsEl.innerText="₹ "+bankBal[key]; 
            });
            
            let gTotal = document.getElementById('grandTotalBal'); if(gTotal) gTotal.innerText="₹ "+(f1Bal+f2Bal+pwBal+pnBal+mBal+tUpi+cBal);
            
            let idMap = { 'f1Bal':f1Bal, 'f2Bal':f2Bal, 'pwBal':pwBal, 'pnBal':pnBal, 'mBal':mBal, 'cBal':cBal };
            for(let key in idMap) {
                let el = document.getElementById(key); if(el) el.innerText = "₹ "+idMap[key];
                let tsEl = document.getElementById('tsys_'+key); if(tsEl) tsEl.innerText = "₹ "+idMap[key];
            }
            
            let tUpiEl = document.getElementById('totalUpiBal'); if(tUpiEl) tUpiEl.innerText="₹ "+tUpi;
            let tInc = document.getElementById('todayInc'); if(tInc) tInc.innerText="₹ "+incT; 
            let tExp = document.getElementById('todayExp'); if(tExp) tExp.innerText="₹ "+expT; 
            let mInc = document.getElementById('monthInc'); if(mInc) mInc.innerText="₹ "+incM; 
            let mExp = document.getElementById('monthExp'); if(mExp) mExp.innerText="₹ "+expM;
            
            ['cBal','f1Bal','f2Bal','pwBal','pnBal','mBal','b1','b2','b3','b4','b5','b6','b7','b8','b9'].forEach(k => { if(document.getElementById('tsys_'+k)) calcTally(k); });
            
            filterData();
        }

        function renderStatementTable(dataList) {
            const table = document.getElementById("statementTableEntries"); table.innerHTML = ""; const sel = document.getElementById('walletFilter').value; let runBal = 0; let sumP = 0; let sumM = 0; let sumC = 0;
            const f1=localStorage.getItem("wallet_fino1")||"Fino Dipak"; const f2=localStorage.getItem("wallet_fino2")||"Fino Pallavi"; const pw=localStorage.getItem("wallet_payworld")||"Payworld"; const pn=localStorage.getItem("wallet_paynearby")||"Paynearby"; const mp=localStorage.getItem("wallet_mahapower")||"Mahapower";

            dataList.forEach((data) => {
                let dtStr = "Loading..."; if (data.timestamp) dtStr = data.timestamp.toDate().toLocaleString('en-IN', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
                const amt = parseFloat(data.amount) || 0; const comm = parseFloat(data.commission) || 0;
                let bSrc = getSafeString(data.bankSource); let eSrc = getSafeString(data.expenseSource); let svc = getSafeString(data.service);
                if (LEGACY_MAP[bSrc]) bSrc = LEGACY_MAP[bSrc]; if (LEGACY_MAP[eSrc]) eSrc = LEGACY_MAP[eSrc];

                if (sel === "All") {
                    if(svc.includes("Opening") || svc === "Udhar Received") runBal += amt; 
                    else if(svc === "Shop Expense" || svc.includes("Cash Deposit") || svc === "Self Bank Deposit") runBal -= amt;
                    if(data.category === "Mahaonline") runBal += amt; 
                    else if(comm > 0) runBal += comm;
                } else {
                    let imp = 0;
                    if(data.category === "Mahaonline") { if(bSrc === sel) imp = amt; else if(sel === "Cash" && bSrc === "Cash") imp = amt; } 
                    else {
                        if (sel === "Fino") { if (svc === "Fino Opening" || svc === "Fino Payment Bank") imp = amt; else if (svc === "Fino Cash Deposit" || (svc === "Shop Expense" && eSrc === "Fino")) imp = -amt; }
                        else if (sel === "Fino2") { if (svc === "Fino2 Opening" || svc === "Fino2 Payment Bank") imp = amt; else if (svc === "Fino2 Cash Deposit" || (svc === "Shop Expense" && eSrc === "Fino2")) imp = -amt; }
                        else if (sel === "Payworld") { if (svc === "Payworld Opening" || svc === "Payworld Services" || svc === "Payworld Cash Deposit") imp = amt; else if (svc === "Shop Expense" && eSrc === "Payworld") imp = -amt; }
                        else if (sel === "Paynearby") { if (svc === "Paynearby Opening" || svc === "Paynearby Services" || svc === "Paynearby Cash Deposit") imp = amt; else if (svc === "Shop Expense" && eSrc === "Paynearby") imp = -amt; }
                        else if (sel === "Mahapower") { if (svc === "Mahapower Opening") imp = amt; else if (svc === "Mahapower Bill Collection" || (svc === "Shop Expense" && eSrc === "Mahapower")) imp = -amt; }
                        else if (sel === "Cash") {
                            if (svc === "Cash Opening" || svc.includes("Cash Deposit") || svc === "Mahapower Bill Collection" || svc === "Money Transfer" || svc === "Self Bank Withdrawal" || svc === "Udhar Received") imp = amt;
                            else if (svc.includes("Payment Bank") || svc.includes("Payworld Services") || svc.includes("Paynearby Services") || svc === "UPI Cash Given" || svc === "Self Bank Deposit" || (svc === "Shop Expense" && eSrc === "Cash")) imp = -amt;
                        } else {
                            if (svc === `${sel} Opening` || (svc === "UPI Cash Given" && bSrc === sel) || (svc === "Self Bank Deposit" && bSrc === sel)) imp = amt;
                            else if ((svc === "Money Transfer" && bSrc === sel) || (svc === "Self Bank Withdrawal" && bSrc === sel) || (svc === "Shop Expense" && eSrc === sel)) imp = -amt;
                        }
                    }
                    if(sel === "Cash" && comm > 0) imp += comm;
                    runBal += imp;
                }

                let svcDisp = svc; if(svcDisp.includes("Fino2")) svcDisp = svcDisp.replace("Fino2", f2); if(svcDisp.includes("Fino") && !svcDisp.includes(f2)) svcDisp = svcDisp.replace("Fino", f1); if(svcDisp.includes("Payworld")) svcDisp = svcDisp.replace("Payworld", pw); if(svcDisp.includes("Paynearby")) svcDisp = svcDisp.replace("Paynearby", pn); if(svcDisp.includes("Mahapower")) svcDisp = svcDisp.replace("Mahapower", mp);
                let amtDisp = `₹ ${data.amount}`; let isPlus = false; let isMinus = false;

                if(data.category === "Mahaonline") { svcDisp = `<b>[Mahaonline]</b> ${svc}`; let bName = localStorage.getItem("wallet_" + bSrc) || bSrc; amtDisp = `<span class="text-green">+ ₹ ${data.amount} (${bName})</span>`; isPlus = true; }
                else if(svc === "Money Transfer" || svc === "UPI Cash Given") { let dBank = localStorage.getItem("wallet_" + bSrc) || bSrc; svcDisp += ` (${dBank})`; if(svc === "Money Transfer") isPlus = true; else isMinus = true; } 
                else if(svc === "Self Bank Deposit" || svc === "Self Bank Withdrawal") { let dBank = localStorage.getItem("wallet_" + bSrc) || bSrc; svcDisp = `<span class="text-blue">${svc} (${dBank})</span>`; if(svc === "Self Bank Deposit") isPlus = true; else isMinus = true; }
                else if(svc === "Shop Expense") { let dExp = localStorage.getItem("wallet_" + eSrc) || eSrc; if(eSrc==="Fino") dExp=f1; else if(eSrc==="Fino2") dExp=f2; else if(eSrc==="Payworld") dExp=pw; else if(eSrc==="Paynearby") dExp=pn; amtDisp = `<span class="text-red">- ₹ ${data.amount} (${dExp})</span>`; isMinus = true; } 
                else if(svc.includes("Cash Deposit") || svc === "Mahapower Bill Collection") { amtDisp = `<span class="text-red">- ₹ ${data.amount}</span>`; isMinus = true; } 
                else if(svc === "Udhar Received" || !svc.includes("Opening")) { amtDisp = `<span class="text-green">+ ₹ ${data.amount}</span>`; isPlus = true; }

                if(sel !== "All") {
                    let imp = 0;
                    if(data.category === "Mahaonline") { if(bSrc === sel) imp = amt; else if(sel === "Cash" && bSrc === "Cash") imp = amt; } 
                    else {
                        if (sel === "Fino") { if (svc === "Fino Opening" || svc === "Fino Payment Bank") imp = amt; else if (svc === "Fino Cash Deposit" || (svc === "Shop Expense" && eSrc === "Fino")) imp = -amt; }
                        else if (sel === "Fino2") { if (svc === "Fino2 Opening" || svc === "Fino2 Payment Bank") imp = amt; else if (svc === "Fino2 Cash Deposit" || (svc === "Shop Expense" && eSrc === "Fino2")) imp = -amt; }
                        else if (sel === "Payworld") { if (svc === "Payworld Opening" || svc === "Payworld Services" || svc === "Payworld Cash Deposit") imp = amt; else if (svc === "Shop Expense" && eSrc === "Payworld") imp = -amt; }
                        else if (sel === "Paynearby") { if (svc === "Paynearby Opening" || svc === "Paynearby Services" || svc === "Paynearby Cash Deposit") imp = amt; else if (svc === "Shop Expense" && eSrc === "Paynearby") imp = -amt; }
                        else if (sel === "Mahapower") { if (svc === "Mahapower Opening") imp = amt; else if (svc === "Mahapower Bill Collection" || (svc === "Shop Expense" && eSrc === "Mahapower")) imp = -amt; }
                        else if (sel === "Cash") {
                            if (svc === "Cash Opening" || svc.includes("Cash Deposit") || svc === "Mahapower Bill Collection" || svc === "Money Transfer" || svc === "Self Bank Withdrawal" || svc === "Udhar Received") imp = amt;
                            else if (svc.includes("Payment Bank") || svc.includes("Payworld Services") || svc.includes("Paynearby Services") || svc === "UPI Cash Given" || svc === "Self Bank Deposit" || (svc === "Shop Expense" && eSrc === "Cash")) imp = -amt;
                        } else {
                            if (svc === `${sel} Opening` || (svc === "UPI Cash Given" && bSrc === sel) || (svc === "Self Bank Deposit" && bSrc === sel)) imp = amt;
                            else if ((svc === "Money Transfer" && bSrc === sel) || (svc === "Self Bank Withdrawal" && bSrc === sel) || (svc === "Shop Expense" && eSrc === sel)) imp = -amt;
                        }
                    }
                    if(sel === "Cash" && comm > 0) imp += comm;
                    if(imp > 0) { isPlus = true; isMinus = false; amtDisp = `<span class="text-green">+ ₹ ${Math.abs(imp)}</span>`; } else if(imp < 0) { isPlus = false; isMinus = true; amtDisp = `<span class="text-red">- ₹ ${Math.abs(imp)}</span>`; } else { isPlus = false; isMinus = false; }
                }

                if(isPlus) sumP += (sel !== "All" && !svc.includes("Opening") ? Math.abs(amt) : amt); if(isMinus) sumM += (sel !== "All" && !svc.includes("Opening") ? Math.abs(amt) : amt); sumC += comm;
                let purpTxt = data.purpose || "-"; if(data.narration && data.narration !== "-") purpTxt += ` <br><small style="color: #64748b;">📝 ${data.narration}</small>`;

                table.innerHTML += `<tr><td>${dtStr}</td><td>${svcDisp}</td><td><b>${data.details}</b></td><td>${(data.mobile&&data.mobile!=="-")?data.mobile:"-"}</td><td><b>${(data.idProof&&data.idProof!=="-")?data.idProof:"-"}</b></td><td>${data.payStatus}</td><td>${purpTxt}</td><td>${amtDisp}</td><td class="text-green">${comm > 0 ? "+ ₹ "+comm : "-"}</td><td><strong>₹ ${runBal}</strong></td><td class="no-print"><button class="edit-btn" onclick="editTxn('${data.id}')">✏️ Edit</button><button class="delete-btn" onclick="deleteEntry('${data.id}')">❌</button></td></tr>`;
            });
            document.getElementById("statementTotalFoot").innerHTML = `<tr><td colspan="7" style="text-align: right; color: var(--primary); font-size:14px;"><b>येथील एकूण (Total):</b></td><td><span class="text-green">+ ₹ ${sumP}</span><br><span class="text-red">- ₹ ${sumM}</span></td><td class="text-green" style="font-size:14px;">+ ₹ ${sumC}</td><td colspan="2"></td></tr>`;
        }

        function filterData() {
            const sel = document.getElementById('walletFilter').value; const f = document.getElementById('fromDate').value; const t = document.getElementById('toDate').value; const searchQ = document.getElementById('stmtSearch').value.toLowerCase().trim();
            let filtered = allTransactions.filter(item => {
                let match = true;
                if(sel !== "All") {
                    let bSrc = getSafeString(item.bankSource); let eSrc = getSafeString(item.expenseSource); let svc = getSafeString(item.service);
                    if (LEGACY_MAP[bSrc]) bSrc = LEGACY_MAP[bSrc]; if (LEGACY_MAP[eSrc]) eSrc = LEGACY_MAP[eSrc]; if (svc.includes("Opening") && LEGACY_MAP[svc.replace(" Opening", "")]) svc = LEGACY_MAP[svc.replace(" Opening", "")] + " Opening";
                    if(item.category === "Mahaonline") match = (bSrc === sel) || (sel === "Cash" && bSrc === "Cash");
                    else if(sel === "Fino") match = (svc.includes("Fino") && !svc.includes("Fino2")) || eSrc === "Fino";
                    else if(sel === "Fino2") match = svc.includes("Fino2") || eSrc === "Fino2"; else if(sel === "Payworld") match = svc.includes("Payworld") || eSrc === "Payworld"; else if(sel === "Paynearby") match = svc.includes("Paynearby") || eSrc === "Paynearby"; else if(sel === "Mahapower") match = svc.includes("Mahapower") || eSrc === "Mahapower"; else match = svc.includes(sel) || bSrc === sel || eSrc === sel;
                }
                if(match && searchQ) {
                    let amtStr = (item.amount || 0).toString(); let detStr = (item.details || "").toLowerCase(); let svcStr = (item.service || "").toLowerCase();
                    if (!amtStr.includes(searchQ) && !detStr.includes(searchQ) && !svcStr.includes(searchQ)) match = false;
                }
                return match;
            });
            if(f && t) { const fromDate = new Date(f); fromDate.setHours(0,0,0,0); const toDate = new Date(t); toDate.setHours(23,59,59,999); filtered = filtered.filter(item => { if(!item.timestamp) return false; const d = item.timestamp.toDate(); return d >= fromDate && d <= toDate; }); }
            renderStatementTable(filtered);
        }
        
        function resetFilter() { 
            document.getElementById('walletFilter').value = "All"; 
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const todayStr = `${yyyy}-${mm}-${dd}`;
            document.getElementById('fromDate').value = todayStr; 
            document.getElementById('toDate').value = todayStr; 
            document.getElementById('stmtSearch').value = ""; 
            filterData(); 
        }

        function clearUdhar(docId, category, pendingAmount, name, mobile) {
            if(confirm("ही उधारी जमा झाली असे मार्क करायचे का?")) {
                db.collection("transactions").doc(docId).update({ payStatus: "Paid" }).then(() => { db.collection("transactions").add({ category: "General", service: "Udhar Received", amount: Number(pendingAmount), bankSource: "Cash", expenseSource: "-", details: name + " (उधारी जमा)", mobile: mobile, village: "-", payStatus: "Paid", purpose: "उधारी क्लिअर", idProof: "-", commission: 0, narration: "Udhar Cleared", timestamp: firebase.firestore.FieldValue.serverTimestamp() }); alert("उधारी जमा झाली!"); });
            }
        }
        function renderUdharKhata(dataList) {
            const tbody = document.getElementById("udharTableBody"); const tickerBox = document.getElementById("udharTickerBox"); const tickerText = document.getElementById("udharTickerText");
            if(!tbody || !tickerBox) return; tbody.innerHTML = ""; let totalUdhar = 0; let tickerStr = ""; let udharData = dataList.filter(d => d.payStatus === "Udhar");
            udharData.forEach(data => {
                let pending = data.category === "Mahaonline" ? (data.pendingAmount || 0) : data.amount; totalUdhar += pending; let dateStr = data.timestamp ? data.timestamp.toDate().toLocaleDateString('en-IN') : "-";
                tbody.innerHTML += `<tr><td>${dateStr}</td><td><b>${data.details}</b></td><td>${data.mobile}</td><td>${data.service}</td><td class="text-red"><b>₹ ${pending}</b></td><td class="no-print"><button class="done-btn" onclick="clearUdhar('${data.id}', '${data.category}', ${pending}, '${data.details}', '${data.mobile}')">✔️ जमा झाली</button></td></tr>`;
                tickerStr += ` &nbsp;&nbsp;🔴 <b>${data.details || "अज्ञात"}</b> &nbsp;👉&nbsp; <b>₹ ${pending}</b> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; `;
            });
            let tl = document.getElementById("totalUdharAmount"); if(tl) tl.innerText = `₹ ${totalUdhar}`;
            if(udharData.length > 0) { tickerText.innerHTML = tickerStr; tickerBox.style.display = "flex"; } else tickerBox.style.display = "none";
        }
        function downloadExcel() { let csv = []; let rows = document.querySelectorAll("#reportTable tr"); for (let i = 0; i < rows.length; i++) { let row = []; let cols = rows[i].querySelectorAll("td, th"); for (let j = 0; j < cols.length; j++) { if(cols[j].classList.contains("no-print")) continue; let data = cols[j].innerText.replace(/(\r\n|\n|\r)/gm, " ").replace(/,/g, " "); row.push('"' + data + '"'); } csv.push(row.join(",")); } let csvFile = new Blob(["\uFEFF"+csv.join("\n")], {type: "text/csv;charset=utf-8;"}); let downloadLink = document.createElement("a"); downloadLink.download = "Pusdekar_Full_Statement.csv"; downloadLink.href = window.URL.createObjectURL(csvFile); downloadLink.style.display = "none"; document.body.appendChild(downloadLink); downloadLink.click(); }
    </script>
