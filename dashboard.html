<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Pusdekar Services</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #007BFF; color: white; padding: 10px 20px; border-radius: 8px; }
        .logout-btn { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .logout-btn:hover { background: #c82333; }
        
        .summary-cards { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; flex: 1; min-width: 200px; text-align: center; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); }
        .card h4 { margin: 0 0 10px 0; color: #555; }
        .card.income h3 { color: #28a745; margin: 0; font-size: 28px; }
        .card.expense h3 { color: #dc3545; margin: 0; font-size: 28px; }

        .container { background: white; padding: 20px; margin-top: 20px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); }
        .form-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; min-width: 250px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .save-btn { background: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        .save-btn:hover { background: #218838; }
        
        .table-responsive { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); min-width: 900px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #007BFF; color: white; white-space: nowrap; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .delete-btn:hover { background: #c82333; }
        .highlight-alert { color: #dc3545; font-size: 12px; font-weight: bold; margin-top: 4px; display: block; }
        .search-msg { color: #28a745; font-size: 12px; font-weight: bold; margin-top: 4px; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Pusdekar Services - Daily Management</h2>
        <button class="logout-btn" onclick="logoutUser()">Logout</button>
    </div>

    <!-- Summary Cards -->
    <div class="summary-cards">
        <div class="card income">
            <h4>आजची एकूण कमाई (कमिशन)</h4>
            <h3 id="todayIncome">₹ 0</h3>
        </div>
        <div class="card expense">
            <h4>आजचा एकूण खर्च</h4>
            <h3 id="todayExpense">₹ 0</h3>
        </div>
    </div>

    <!-- Entry Form -->
    <div class="container">
        <h3 style="margin-top: 0;">नवीन नोंद (New Entry)</h3>
        
        <div class="form-row">
            <div class="form-group">
                <label>सर्व्हिसचा प्रकार (Service Type)</label>
                <select id="serviceType">
                    <option value="Money Transfer">Money Transfer (PhonePe/GPay)</option>
                    <option value="Fino Payment Bank">Fino Payment Bank</option>
                    <option value="PAN / Aadhaar Services">PAN / Aadhaar Services</option>
                    <option value="Printing & Xerox">Xerox / Printing / Banner</option>
                    <option value="Bill Payment">Bill Payment / Recharge</option>
                    <option value="Shop Expense">दुकानाचा खर्च (Shop Expense)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>रक्कम (Transaction Amount in ₹) *</label>
                <input type="number" id="amount" placeholder="व्यवहाराची मूळ रक्कम (उदा. 15000)">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>ग्राहक मोबाईल नंबर (Mobile Number)</label>
                <!-- onblur मुळे नंबर टाकून बाहेर क्लिक केल्यावर आपोआप नाव शोधले जाईल -->
                <input type="tel" id="mobile" placeholder="येथे नंबर टाका म्हणजे नाव आपोआप येईल" maxlength="10" onblur="searchCustomer()">
                <span id="searchMsg" class="search-msg">✔️ जुना ग्राहक सापडला!</span>
            </div>

            <div class="form-group">
                <label>तपशील / ग्राहकाचे नाव (Customer Name) *</label>
                <input type="text" id="details" placeholder="ग्राहकाचे पूर्ण नाव">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>व्यवहाराचे कारण (Purpose of Transfer)</label>
                <input type="text" id="purpose" placeholder="उदा. फी भरणे, वैद्यकीय खर्च, इत्यादी">
            </div>

            <div class="form-group">
                <label>पॅन / आधार क्रमांक (PAN/Aadhaar)</label>
                <input type="text" id="idProof" placeholder="₹10,000 च्या वर सक्तीचे आहे">
                <span class="highlight-alert">* CA नियमानुसार: ₹10,000+ मनी ट्रान्सफरसाठी आवश्यक</span>
            </div>
        </div>

        <div class="form-group" style="max-width: 50%;">
            <label>मिळालेले कमिशन (Commission in ₹)</label>
            <input type="number" id="commission" placeholder="या व्यवहारावर तुमची कमाई किती?">
        </div>

        <button class="save-btn" onclick="saveEntry()">Save Entry</button>
    </div>

    <!-- Data Table -->
    <h3 style="margin-top: 30px;">आजचा जमा-खर्च (Recent Entries)</h3>
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>वेळ</th>
                    <th>सर्व्हिस</th>
                    <th>नाव/तपशील</th>
                    <th>मोबाईल नं.</th>
                    <th>कारण</th>
                    <th>पॅन/आधार</th>
                    <th>रक्कम (₹)</th>
                    <th>कमिशन (₹)</th>
                    <th>कृती</th>
                </tr>
            </thead>
            <tbody id="entriesTable">
                <!-- Data will load here automatically -->
            </tbody>
        </table>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCKGCAEv8_YiBt1oZzZVz4zMbNL5yiVA1U",
            authDomain: "pusdekar-services.firebaseapp.com",
            projectId: "pusdekar-services",
            storageBucket: "pusdekar-services.firebasestorage.app",
            messagingSenderId: "438865671103",
            appId: "1:438865671103:web:4b0757f0d41c9dde35e70a",
            measurementId: "G-7F82VD9WM9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(); 

        firebase.auth().onAuthStateChanged((user) => {
            if (!user) { window.location.href = "login.html"; }
        });

        function logoutUser() {
            firebase.auth().signOut().then(() => { window.location.href = "login.html"; });
        }

        // --- जुना ग्राहक शोधण्याची सिस्टीम (Auto-Fill) ---
        function searchCustomer() {
            const mobile = document.getElementById('mobile').value;
            const searchMsg = document.getElementById('searchMsg');
            
            // जर नंबर १० अंकी असेल तरच शोधा
            if (mobile.length === 10) {
                db.collection("transactions")
                  .where("mobile", "==", mobile)
                  .limit(1) // फक्त एक जुना रेकॉर्ड आणा
                  .get()
                  .then((querySnapshot) => {
                      if (!querySnapshot.empty) {
                          // ग्राहक सापडला
                          const data = querySnapshot.docs[0].data();
                          document.getElementById('details').value = data.details || "";
                          
                          if(data.idProof && data.idProof !== "-") {
                              document.getElementById('idProof').value = data.idProof;
                          }
                          
                          // हिरवा मेसेज दाखवा
                          searchMsg.style.display = "block";
                          setTimeout(() => { searchMsg.style.display = "none"; }, 3000);
                      }
                  }).catch((error) => {
                      console.log("Error searching customer:", error);
                  });
            }
        }

        function saveEntry() {
            const service = document.getElementById('serviceType').value;
            const amount = document.getElementById('amount').value;
            const details = document.getElementById('details').value;
            const mobile = document.getElementById('mobile').value;
            const purpose = document.getElementById('purpose').value;
            const idProof = document.getElementById('idProof').value;
            const commission = document.getElementById('commission').value;

            if(amount === "" || details === "") {
                alert("कृपया रक्कम आणि ग्राहकाचे नाव नक्की भरा!");
                return;
            }

            if (service === "Money Transfer" && Number(amount) > 10000 && idProof.trim() === "") {
                alert("CA च्या सूचनेनुसार: ₹10,000 पेक्षा जास्त मनी ट्रान्सफरसाठी ग्राहकाचा पॅन किंवा आधार क्रमांक टाकणे अनिवार्य आहे!");
                return; 
            }

            db.collection("transactions").add({
                service: service,
                amount: Number(amount),
                details: details,
                mobile: mobile || "-", 
                purpose: purpose || "-",
                idProof: idProof || "-",
                commission: Number(commission) || 0, 
                timestamp: firebase.firestore.FieldValue.serverTimestamp() 
            }).then(() => {
                // फॉर्म रिकामा करणे
                document.getElementById('amount').value = "";
                document.getElementById('details').value = "";
                document.getElementById('mobile').value = "";
                document.getElementById('purpose').value = "";
                document.getElementById('idProof').value = "";
                document.getElementById('commission').value = "";
            }).catch((error) => {
                alert("Error: " + error.message);
            });
        }

        function deleteEntry(docId) {
            if(confirm("तुम्हाला नक्की ही नोंद डिलीट करायची आहे का?")) {
                db.collection("transactions").doc(docId).delete().catch((error) => {
                    alert("Error removing document: " + error);
                });
            }
        }

        db.collection("transactions").orderBy("timestamp", "desc").onSnapshot((querySnapshot) => {
            const table = document.getElementById("entriesTable");
            table.innerHTML = ""; 
            
            let todayIncome = 0;
            let todayExpense = 0;
            const todayDateStr = new Date().toLocaleDateString('en-IN'); 

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                const docId = doc.id; 
                
                let dateStr = "Loading...";
                let isToday = false;

                if (data.timestamp) {
                    const dateObj = data.timestamp.toDate();
                    dateStr = dateObj.toLocaleString('en-IN'); 
                    
                    if(dateObj.toLocaleDateString('en-IN') === todayDateStr) {
                        isToday = true;
                    }
                }

                if(isToday) {
                    const amt = parseFloat(data.amount) || 0;
                    const comm = parseFloat(data.commission) || 0;

                    if(data.service === "Shop Expense") {
                        todayExpense += amt; 
                    } else {
                        todayIncome += comm; 
                    }
                }

                const mob = data.mobile ? data.mobile : "-";
                const pur = data.purpose ? data.purpose : "-";
                const idp = data.idProof ? data.idProof : "-";
                const comDisp = data.commission ? data.commission : "0";

                const row = `<tr>
                                <td>${dateStr}</td>
                                <td>${data.service}</td>
                                <td>${data.details}</td>
                                <td>${mob}</td>
                                <td>${pur}</td>
                                <td>${idp}</td>
                                <td>₹ ${data.amount}</td>
                                <td>₹ ${comDisp}</td>
                                <td><button class="delete-btn" onclick="deleteEntry('${docId}')">Delete</button></td>
                             </tr>`;
                table.innerHTML += row;
            });

            document.getElementById('todayIncome').innerText = "₹ " + todayIncome;
            document.getElementById('todayExpense').innerText = "₹ " + todayExpense;
        });
    </script>
</body>
</html>
