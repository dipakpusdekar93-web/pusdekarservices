<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pusdekar Digital - Daily Management System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #007BFF; color: white; padding: 10px 20px; border-radius: 8px; }
        .logout-btn { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .logout-btn:hover { background: #c82333; }
        
        .summary-cards { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; flex: 1; min-width: 200px; text-align: center; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); }
        .card h4 { margin: 0 0 10px 0; color: #555; font-size: 15px; }
        .card.income h3 { color: #28a745; margin: 0; font-size: 24px; }
        .card.expense h3 { color: #dc3545; margin: 0; font-size: 24px; }
        .card.monthly h3 { color: #17a2b8; margin: 0; font-size: 24px; }

        .container { background: white; padding: 20px; margin-top: 20px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); }
        .form-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
        .form-group { flex: 1; min-width: 230px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .save-btn { background: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
        .save-btn:hover { background: #218838; }
        
        /* Filter & Print Bar */
        .filter-section { background: white; padding: 15px 20px; margin-top: 20px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .print-btn { background: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; height: 41px; }
        .print-btn:hover { background: #5a6268; }

        .table-responsive { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1); min-width: 1000px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 13px; }
        th { background-color: #007BFF; color: white; white-space: nowrap; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .delete-btn:hover { background: #c82333; }
        .highlight-alert { color: #dc3545; font-size: 11px; font-weight: bold; margin-top: 3px; display: block; }
        .search-msg { color: #28a745; font-size: 11px; font-weight: bold; margin-top: 3px; display: none; }

        /* Print Settings */
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; background-color: white; }
            table { box-shadow: none; width: 100%; min-width: auto; border: 1px solid #000; }
            th, td { border: 1px solid #000; color: #000; padding: 5px; font-size: 11px; }
            th { background-color: #f2f2f2; color: #000; }
            .header { background: none; color: black; padding: 0; border: none; text-align: center; justify-content: center; margin-bottom: 15px;}
            .header h2 { font-size: 20px; border-bottom: 2px solid black; padding-bottom: 8px;}
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Pusdekar Digital - Daily Management</h2>
        <button class="logout-btn no-print" onclick="logoutUser()">Logout</button>
    </div>

    <!-- Summary Cards -->
    <div class="summary-cards no-print">
        <div class="card income">
            <h4>आजची एकूण कमाई (कमिशन)</h4>
            <h3 id="todayIncome">₹ 0</h3>
        </div>
        <div class="card expense">
            <h4>आजचा एकूण खर्च</h4>
            <h3 id="todayExpense">₹ 0</h3>
        </div>
        <div class="card monthly">
            <h4>या महिन्याची एकूण कमाई</h4>
            <h3 id="monthlyIncome">₹ 0</h3>
        </div>
    </div>

    <!-- Entry Form -->
    <div class="container no-print">
        <h3 style="margin-top: 0; color: #007BFF;">नवीन नोंद (New Entry)</h3>
        
        <div class="form-row">
            <div class="form-group">
                <label>सर्व्हिसचा प्रकार (Service Type)</label>
                <select id="serviceType">
                    <option value="Money Transfer">Money Transfer (PhonePe/GPay)</option>
                    <option value="Fino Payment Bank">Fino Payment Bank</option>
                    <option value="PAN / Aadhaar Services">PAN / Aadhaar Services</option>
                    <option value="Printing & Xerox">Xerox / Printing / Banner</option>
                    <option value="Bill Payment">Bill Payment / Recharge</option>
                    <option value="Shop Expense">दुकानाचा खर्च (Shop Expense)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>रक्कम (Transaction Amount in ₹) *</label>
                <input type="number" id="amount" placeholder="व्यवहाराची मूळ रक्कम">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>ग्राहक मोबाईल नंबर (Mobile Number)</label>
                <input type="tel" id="mobile" placeholder="नंबर टाकताच जुनी माहिती येईल" maxlength="10" onblur="searchCustomer()">
                <span id="searchMsg" class="search-msg">✔️ जुना ग्राहक सापडला!</span>
            </div>

            <div class="form-group">
                <label>तपशील / ग्राहकाचे नाव (Customer Name) *</label>
                <input type="text" id="details" placeholder="ग्राहकाचे पूर्ण नाव">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>पत्ता (गावाचे नाव / तहसील)</label>
                <input type="text" id="address" placeholder="उदा. माढेळी, सिंधी">
            </div>

            <div class="form-group">
                <label>पेमेंट स्थिती (Payment Status)</label>
                <select id="payStatus">
                    <option value="Paid">Paid (रोख/ऑनलाइन जमा)</option>
                    <option value="Udhar">Udhar (उधारी / बाकी)</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>व्यवहाराचे कारण (Purpose)</label>
                <input type="text" id="purpose" placeholder="उदा. फी भरणे, घरखर्च, इ.">
            </div>

            <div class="form-group">
                <label>पॅन / आधार क्रमांक (PAN/Aadhaar)</label>
                <input type="text" id="idProof" placeholder="₹10,000 च्या वर सक्तीचे">
                <span class="highlight-alert">* ₹10,000+ मनी ट्रान्सफरसाठी आवश्यक</span>
            </div>
        </div>

        <div class="form-group" style="max-width: 50%;">
            <label>मिळालेले कमिशन (Commission in ₹)</label>
            <input type="number" id="commission" placeholder="तुमची कमाई">
        </div>

        <button class="save-btn" onclick="saveEntry()">Save Entry</button>
    </div>

    <!-- Date Filter & Print Section -->
    <div class="filter-section no-print">
        <div class="form-group" style="margin-bottom:0;">
            <label>कुठून तारीख (From Date):</label>
            <input type="date" id="fromDate" onchange="filterData()">
        </div>
        <div class="form-group" style="margin-bottom:0;">
            <label>कुठपर्यंत तारीख (To Date):</label>
            <input type="date" id="toDate" onchange="filterData()">
        </div>
        <div>
            <button class="print-btn" onclick="window.print()">🖨️ Print Statement</button>
        </div>
        <div>
            <button class="print-btn" style="background:#17a2b8;" onclick="resetFilter()">All Data</button>
        </div>
    </div>

    <!-- Data Table -->
    <div class="table-responsive">
        <table id="reportTable">
            <thead>
                <tr>
                    <th>वेळ/तारीख</th>
                    <th>सर्व्हिस</th>
                    <th>नाव</th>
                    <th>मोबाईल</th>
                    <th>पत्ता</th>
                    <th>स्थिती</th>
                    <th>कारण</th>
                    <th>पॅन/आधार</th>
                    <th>रक्कम (₹)</th>
                    <th>कमिशन (₹)</th>
                    <th class="no-print">कृती</th>
                </tr>
            </thead>
            <tbody id="entriesTable">
                <!-- Data will load here dynamically -->
            </tbody>
        </table>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCKGCAEv8_YiBt1oZzZVz4zMbNL5yiVA1U",
            authDomain: "pusdekar-services.firebaseapp.com",
            projectId: "pusdekar-services",
            storageBucket: "pusdekar-services.firebasestorage.app",
            messagingSenderId: "438865671103",
            appId: "1:438865671103:web:4b0757f0d41c9dde35e70a",
            measurementId: "G-7F82VD9WM9"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(); 

        firebase.auth().onAuthStateChanged((user) => {
            if (!user) { window.location.href = "login.html"; }
        });

        function logoutUser() {
            firebase.auth().signOut().then(() => { window.location.href = "login.html"; });
        }

        // ऑटो-फील ग्राहक शोध सिस्टीम
        function searchCustomer() {
            const mobile = document.getElementById('mobile').value;
            const searchMsg = document.getElementById('searchMsg');
            
            if (mobile.length === 10) {
                db.collection("transactions")
                  .where("mobile", "==", mobile)
                  .limit(1)
                  .get()
                  .then((querySnapshot) => {
                      if (!querySnapshot.empty) {
                          const data = querySnapshot.docs[0].data();
                          document.getElementById('details').value = data.details || "";
                          document.getElementById('address').value = data.address || "";
                          if(data.idProof && data.idProof !== "-") {
                              document.getElementById('idProof').value = data.idProof;
                          }
                          searchMsg.style.display = "block";
                          setTimeout(() => { searchMsg.style.display = "none"; }, 3000);
                      }
                  }).catch((error) => {
                      console.log("Error:", error);
                  });
            }
        }

        function saveEntry() {
            const service = document.getElementById('serviceType').value;
            const amount = document.getElementById('amount').value;
            const details = document.getElementById('details').value;
            const mobile = document.getElementById('mobile').value;
            const address = document.getElementById('address').value;
            const payStatus = document.getElementById('payStatus').value;
            const purpose = document.getElementById('purpose').value;
            const idProof = document.getElementById('idProof').value;
            const commission = document.getElementById('commission').value;

            if(amount === "" || details === "") {
                alert("कृपया रक्कम आणि ग्राहकाचे नाव नक्की भरा!");
                return;
            }

            if (service === "Money Transfer" && Number(amount) > 10000 && idProof.trim() === "") {
                alert("CA नियमानुसार: ₹10,000+ मनी ट्रान्सफरसाठी पॅन किंवा आधार क्रमांक आवश्यक आहे!");
                return; 
            }

            db.collection("transactions").add({
                service: service,
                amount: Number(amount),
                details: details,
                mobile: mobile || "-", 
                address: address || "-",
                payStatus: payStatus,
                purpose: purpose || "-",
                idProof: idProof || "-",
                commission: Number(commission) || 0, 
                timestamp: firebase.firestore.FieldValue.serverTimestamp() 
            }).then(() => {
                document.getElementById('amount').value = "";
                document.getElementById('details').value = "";
                document.getElementById('mobile').value = "";
                document.getElementById('address').value = "";
                document.getElementById('purpose').value = "";
                document.getElementById('idProof').value = "";
                document.getElementById('commission').value = "";
            }).catch((error) => {
                alert("Error: " + error.message);
            });
        }

        function deleteEntry(docId) {
            if(confirm("तुम्हाला नक्की ही नोंद डिलीट करायची आहे का?")) {
                db.collection("transactions").doc(docId).delete().catch((error) => {
                    alert("Error: " + error);
                });
            }
        }

        let allTransactions = [];

        // डेटाबेस मधून लाईव्ह डेटा घेणे
        db.collection("transactions").orderBy("timestamp", "desc").onSnapshot((querySnapshot) => {
            allTransactions = [];
            querySnapshot.forEach((doc) => {
                allTransactions.push({ id: doc.id, ...doc.data() });
            });
            renderTable(allTransactions);
        });

        // टेबल रेंडर करणे आणि फिल्टर्स सांभाळणे
        function renderTable(dataList) {
            const table = document.getElementById("entriesTable");
            table.innerHTML = ""; 
            
            let todayIncome = 0;
            let todayExpense = 0;
            let monthlyIncome = 0;
            
            const now = new Date();
            const todayDateStr = now.toLocaleDateString('en-IN'); 
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();

            dataList.forEach((data) => {
                let dateStr = "Loading...";
                let isToday = false;
                let isThisMonth = false;
                let docDate = null;

                if (data.timestamp) {
                    docDate = data.timestamp.toDate();
                    dateStr = docDate.toLocaleString('en-IN'); 
                    
                    if(docDate.toLocaleDateString('en-IN') === todayDateStr) {
                        isToday = true;
                    }
                    if(docDate.getMonth() === currentMonth && docDate.getFullYear() === currentYear) {
                        isThisMonth = true;
                    }
                }

                const amt = parseFloat(data.amount) || 0;
                const comm = parseFloat(data.commission) || 0;

                if(isToday) {
                    if(data.service === "Shop Expense") {
                        todayExpense += amt; 
                    } else {
                        todayIncome += comm; 
                    }
                }

                if(isThisMonth && data.service !== "Shop Expense") {
                    monthlyIncome += comm;
                }

                const mob = data.mobile ? data.mobile : "-";
                const addr = data.address ? data.address : "-";
                const status = data.payStatus === "Udhar" ? "<span style='color:red; font-weight:bold;'>Udhar</span>" : "Paid";
                const pur = data.purpose ? data.purpose : "-";
                const idp = data.idProof ? data.idProof : "-";
                const comDisp = data.commission ? data.commission : "0";

                const row = `<tr>
                                <td>${dateStr}</td>
                                <td>${data.service}</td>
                                <td>${data.details}</td>
                                <td>${mob}</td>
                                <td>${addr}</td>
                                <td>${status}</td>
                                <td>${pur}</td>
                                <td>${idp}</td>
                                <td>₹ ${data.amount}</td>
                                <td>₹ ${comDisp}</td>
                                <td class="no-print"><button class="delete-btn" onclick="deleteEntry('${data.id}')">Delete</button></td>
                             </tr>`;
                table.innerHTML += row;
            });

            document.getElementById('todayIncome').innerText = "₹ " + todayIncome;
            document.getElementById('todayExpense').innerText = "₹ " + todayExpense;
            document.getElementById('monthlyIncome').innerText = "₹ " + monthlyIncome;
        }

        // तारीख फिल्टर फंक्शन (Date Wise Filter)
        function filterData() {
            const fromDateVal = document.getElementById('fromDate').value;
            const toDateVal = document.getElementById('toDate').value;

            if(!fromDateVal || !toDateVal) return;

            const fromDate = new Date(fromDateVal);
            fromDate.setHours(0,0,0,0);

            const toDate = new Date(toDateVal);
            toDate.setHours(23,59,59,999);

            const filtered = allTransactions.filter(item => {
                if(!item.timestamp) return false;
                const itemDate = item.timestamp.toDate();
                return itemDate >= fromDate && itemDate <= toDate;
            });

            renderTable(filtered);
        }

        function resetFilter() {
            document.getElementById('fromDate').value = "";
            document.getElementById('toDate').value = "";
            renderTable(allTransactions);
        }
    </script>
</body>
</html>
